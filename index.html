        function startApp(l) {
            curL = l;
            document.getElementById('html-tag').dir = trans[l].dir;
            document.getElementById('full-menu-label').innerText = trans[l].full;
            document.getElementById('sauce-label').innerText = trans[l].sauce;
            
            document.getElementById('feedback-label').innerText = trans[l].fbTitle;
            document.getElementById('feedback-text').placeholder = trans[l].fbPlace;
            document.getElementById('feedback-btn').innerText = trans[l].fbBtn;
            
            document.getElementById('search-input').placeholder = trans[l].search;
            document.getElementById('call-text').innerText = trans[l].call;

            renderSauces();
            renderVisualMenu();
            
            document.getElementById('splash').style.transform = 'translateY(-100%)';
        }

        function toggleTheme() {
            let body = document.body;
            body.classList.toggle('dark-mode');
            let btn = document.getElementById('theme-toggle');
            if(body.classList.contains('dark-mode')) {
                btn.innerText = '☀️';
            } else {
                btn.innerText = '🌙';
            }
        }

        function filterMenu() {
            let input = document.getElementById('search-input').value.toLowerCase();
            let cats = document.querySelectorAll('.cat-group');
            
            cats.forEach(cat => {
                let hasVisible = false;
                let items = cat.querySelectorAll('.menu-item-card');
                let subHeaders = cat.querySelectorAll('.sub-header-item');
                
                items.forEach(item => {
                    let title = item.querySelector('h4').innerText.toLowerCase();
                    if(title.includes(input)) {
                        item.style.display = 'flex';
                        hasVisible = true;
                    } else {
                        item.style.display = 'none';
                    }
                });
                
                subHeaders.forEach(sh => {
                    sh.style.display = input.length > 0 ? 'none' : 'flex';
                });
                
                cat.querySelector('.cat-header').style.display = hasVisible ? 'block' : 'none';
            });
        }

        function renderSauces() {
            document.getElementById('sauce-list').innerHTML = menuData.sauces.map(s => `
                <div class="sauce-item">
                    <img src="${s.img}" loading="lazy" onclick="openModal('${s.img}')" onerror="this.src='https://via.placeholder.com/150/ffffff/f97316?text=Sauce'">
                    <h5>${s.n[curL]}</h5>
                    <span>500 ${trans[curL].cur}</span>
                </div>`).join('');
        }

        function renderVisualMenu() {
            let html = '';
            menuData.fullMenu.forEach(cat => {
                html += `<div class="cat-group"><div class="cat-header">${cat.cat[curL]}</div>`;
                cat.items.forEach(item => {
                    if(item.isSub) {
                        html += `<div class="menu-sub-header sub-header-item">${item.n[curL]}</div>`;
                        return;
                    }
                    
                    let extraHtml = item.extra[curL] ? `<span class="extra-price">${item.extra[curL]}</span>` : '';
                    let ingHtml = item.ing[curL] ? `<p>${item.ing[curL]}</p>` : '';
                    let badgeHtml = item.badge ? `<span class="badge ${item.badge}">${trans[curL].badge[item.badge]}</span>` : '';
                    
                    html += `
                        <div class="menu-item-card">
                            <img src="${item.img}" loading="lazy" onclick="openModal('${item.img}')" onerror="this.src='https://via.placeholder.com/150/ffffff/f97316?text=Lee'">
                            <div class="item-details">
                                <div class="item-name-row">
                                    <h4>${item.n[curL]}</h4>
                                    ${badgeHtml}
                                </div>
                                ${extraHtml}
                                ${ingHtml}
                                <span class="item-price">${item.p} ${trans[curL].cur}</span>
                            </div>
                        </div>`;
                });
                html += `</div>`;
            });
            document.getElementById('visual-menu-container').innerHTML = html;
        }

        function toggleView() {
            const container = document.getElementById('visual-menu-container');
            isGridView = !isGridView;
            if(isGridView) {
                container.classList.add('grid-view');
                document.getElementById('view-icon').innerHTML = '<rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/>';
            } else {
                container.classList.remove('grid-view');
                document.getElementById('view-icon').innerHTML = '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>';
            }
        }

        function openModal(src) {
            document.getElementById('modal-img').src = src;
            const modal = document.getElementById('img-modal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeModal() {
            const modal = document.getElementById('img-modal');
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function sendFeedback() {
            const textArea = document.getElementById('feedback-text');
            const text = textArea.value.trim();
            const btn = document.getElementById('feedback-btn');
            const msg = document.getElementById('feedback-msg');

            if (!text) {
                textArea.style.borderColor = "red";
                setTimeout(() => textArea.style.borderColor = "var(--border)", 2000);
                return;
            }

            const originalBtnText = btn.innerText;
            btn.innerText = '...';

            const token = '8689663640:AAFd6TzvT4-pGg0xdnmHXfG42dIJSDonhaU';
            const chat_id = '-1003439527490';
            const message = `📢 فیدباکی نوێ لە مێنۆی لی:\n\n💬 "${text}"`;

            const tgUrl = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(message)}`;
            
            const primaryProxy = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(tgUrl)}`;

            const showSuccess = () => {
                btn.innerText = originalBtnText;
                textArea.value = '';
                msg.innerText = trans[curL].fbThx;
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 4000);
            };

            fetch(primaryProxy)
            .then(res => res.json())
            .then(data => {
                if(data.ok) showSuccess();
                else throw new Error("سێرڤەری یەکەم ڕەتی کردەوە");
            })
            .catch(err => {
                const backupProxy = `https://corsproxy.io/?${encodeURIComponent(tgUrl)}`;
                fetch(backupProxy)
                .then(() => showSuccess())
                .catch(() => showSuccess());
            });
        }
    </script>
